name: Property Engine (Auckland North Shore Suburbs)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scraping Mode"
        required: true
        default: "discovery"
        type: choice
        options:
          - discovery
          - backfill
          - refresh
      ta_slug:
        description: "Territorial Authority slug (propertyvalue.co.nz path segment). Default north-shore-city. e.g. north-shore-city, auckland"
        required: true
        default: "north-shore-city"
        type: string
      suburbs:
        description: "Suburbs to scrape"
        required: true
        default: "Northcross,Oteha,Torbay,Fairview Heights,Waiake,Browns Bay,Pinehill,Rothesay Bay,Murrays Bay,Albany"
        type: string
      force_run:
        description: "Force run"
        type: boolean
        required: false
        default: false
      address:
        description: "Target a single property address in backfill mode (e.g. '850A Beach Road, Waiake'). Leave empty to use suburbs."
        required: false
        default: ""
        type: string
      refill:
        description: "Run discovery first in backfill mode to find and fill missing addresses"
        type: boolean
        required: false
        default: false

  # schedule:
  #   - cron: "0 0 * * *"  # Disabled — manual trigger only

permissions:
  contents: read
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    concurrency:
      group: property-engine-auckland-suburbs
      cancel-in-progress: true

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROPERTY_VALUE_BASE_URL: ${{ secrets.PROPERTY_VALUE_BASE_URL }}
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_TIMEOUT: "120000"
      PLAYWRIGHT_NAVIGATION_TIMEOUT: "120000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run database migrations
        run: |
          python database/scripts/run_migrations.py

      - name: Determine Task ID
        id: task_id
        run: |
          echo "task_id=12" >> $GITHUB_OUTPUT

      - name: Check and acquire lock
        id: check_lock
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$FORCE_RUN" = "true" ]; then FORCE_FLAG="--force"; fi
          python database/scripts/gh_lock_manager.py --action check --task-id ${{ steps.task_id.outputs.task_id }} $FORCE_FLAG

      - name: Set status to running
        if: steps.check_lock.outputs.should_run == 'true'
        run: python database/scripts/gh_lock_manager.py --action running --task-id ${{ steps.task_id.outputs.task_id }}

      - name: Run Discovery Mode
        id: discovery
        if: steps.check_lock.outputs.should_run == 'true' && inputs.mode == 'discovery'
        run: |
          SUBURBS_VAL="${{ inputs.suburbs || 'Northcross,Oteha,Torbay,Fairview Heights,Waiake,Browns Bay,Pinehill,Rothesay Bay,Murrays Bay,Albany' }}"
          
          echo "========================================="
          echo "🚀 Starting DISCOVERY mode"
          echo "========================================="
          echo "TA: ${{ inputs.ta_slug }}"
          echo "Suburbs: $SUBURBS_VAL"
          echo "Max runtime: 5 hours"
          echo "========================================="
          
          python scrapers/property_value_engine.py \
            --mode discovery \
            --region auckland \
            --task_id ${{ steps.task_id.outputs.task_id }} \
            --max_runtime 5 \
            --ta "${{ inputs.ta_slug }}" \
            --suburbs "$SUBURBS_VAL" \
            ${{ inputs.force_run && '--force' || '' }}

      - name: Run Backfill Mode (after discovery or standalone)
        if: |
          steps.check_lock.outputs.should_run == 'true'
          && (inputs.mode == 'backfill' || inputs.mode == 'discovery')
        run: |
          SUBURBS_VAL="${{ inputs.suburbs || 'Northcross,Oteha,Torbay,Fairview Heights,Waiake,Browns Bay,Pinehill,Rothesay Bay,Murrays Bay,Albany' }}"
          ADDRESS="${{ inputs.address }}"
          
          echo ""
          echo "========================================="
          echo "🔄 Starting BACKFILL mode"
          echo "========================================="
          echo "Suburbs: $SUBURBS_VAL"
          echo "Address: ${ADDRESS:-none}"
          echo "Max runtime: 5 hours"
          echo "========================================="
          
          BACKFILL_ARGS=(--mode backfill --region auckland --task_id ${{ steps.task_id.outputs.task_id }} --max_runtime 5 --force --suburbs "$SUBURBS_VAL")
          if [ -n "$ADDRESS" ]; then BACKFILL_ARGS+=(--address "$ADDRESS"); fi
          if [ "${{ inputs.refill }}" = "true" ]; then BACKFILL_ARGS+=(--refill); fi

          python scrapers/property_value_engine.py "${BACKFILL_ARGS[@]}"

      - name: Run Refresh Mode
        if: steps.check_lock.outputs.should_run == 'true' && inputs.mode == 'refresh'
        run: |
          SUBURBS_VAL="${{ inputs.suburbs || 'Northcross,Oteha,Torbay,Fairview Heights,Waiake,Browns Bay,Pinehill,Rothesay Bay,Murrays Bay,Albany' }}"
          
          echo "========================================="
          echo "🔄 Starting REFRESH mode"
          echo "========================================="
          echo "TA: ${{ inputs.ta_slug }}"
          echo "Suburbs: $SUBURBS_VAL"
          echo "Max runtime: 5 hours"
          echo "========================================="
          
          python scrapers/property_value_engine.py \
            --mode refresh \
            --region auckland \
            --task_id ${{ steps.task_id.outputs.task_id }} \
            --max_runtime 5 \
            --ta "${{ inputs.ta_slug }}" \
            --suburbs "$SUBURBS_VAL" \
            ${{ inputs.force_run && '--force' || '' }}

      - name: Reset status
        if: always() && steps.check_lock.outputs.should_run == 'true'
        run: |
          python database/scripts/gh_lock_manager.py --action reset --task-id ${{ steps.task_id.outputs.task_id }}

      - name: Trigger next run if not complete (Breakpoint Resume)
        if: always() && steps.check_lock.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(python database/scripts/check_resume_state.py --task-id ${{ steps.task_id.outputs.task_id }})

          echo "Resume check result: $RESULT"

          if [ "$RESULT" = "COMPLETE" ]; then
            echo "✅ Task ${{ steps.task_id.outputs.task_id }} is complete. Scraping cycle finished!"
          elif [ "$RESULT" = "HAS_PROGRESS" ]; then
            NEXT_MODE="${{ inputs.mode }}"
            echo "🔄 Task has saved progress. Triggering next run to resume from breakpoint in $NEXT_MODE mode..."
            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/property_scraper_auckland_suburbs.yml/dispatches \
               -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$NEXT_MODE\",\"ta_slug\":\"${{ inputs.ta_slug }}\",\"suburbs\":\"${{ inputs.suburbs }}\",\"address\":\"${{ inputs.address }}\",\"refill\":\"${{ inputs.refill }}\",\"force_run\":\"false\"}}"
            echo "✅ Next run triggered to continue from breakpoint"
          else
            echo "Task has no saved progress. No auto-trigger performed."
          fi

      - name: Show completion summary
        if: success() && (inputs.mode == 'discovery' || inputs.mode == 'backfill')
        run: |
          echo ""
          echo "========================================="
          echo "🎉 Workflow completed successfully!"
          echo "========================================="
          echo ""
          echo "📊 What was done:"
          if [ "${{ inputs.mode }}" == "discovery" ]; then
            echo "   1. ✅ Discovery: Collected property addresses"
            echo "   2. ✅ Backfill: Populated detailed data (images, beds, RV, etc.)"
          else
            echo "   ✅ Backfill: Populated detailed data (images, beds, RV, etc.)"
          fi
          echo ""
          echo "🔍 Verify data:"
          echo "   1. Check your frontend property cards"
          echo "   2. Confirm images are displayed"
          echo "   3. Confirm RV, bedrooms, bathrooms are filled"
          echo ""
          echo "========================================="

      - name: Upload Error Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots-auckland-suburbs
          path: screenshots/
          retention-days: 7
